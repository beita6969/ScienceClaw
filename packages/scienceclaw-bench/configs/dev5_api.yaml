# First real-API development run: one discipline per family, 2 rounds, 2 episodes per held-out split.
name: dev5_api
runs_root: runs
llm:
  credentials_file: ~/.config/student-api/client.json
  policy: {model: lab-gpt-5.4-mini, max_tokens: 8000, temperature: 0.0, reasoning_effort: low, json_mode: true}
  executor: {model: lab-gpt-5.4-mini, max_tokens: 2000, temperature: 0.0, reasoning_effort: low, json_mode: false}
  patch: {model: lab-gpt-5.4-mini, max_tokens: 4000, temperature: 0.0, reasoning_effort: low, json_mode: false}
  concurrency: 16
  cache_path: cache/llm_cache.sqlite
  use_cache: true
solver:
  max_steps: 24
evolution:
  variant: full
  qval: macrosr_then_score
  qval_eps: 0.02
  budget_tokens_per_val_episode: 250000.0
  budget_beta: 0.5
  min_improved_episodes: 2
bench:
  disciplines: [FoR31, FoR34, FoR46, FoR35, FoR48]   # Life&health, Physical&Earth, Eng&computing, Social, Humanities&law
  items_per_episode: 16
  rounds: 2
  n_val: 2
  n_id: 2
  n_ood: 2
  seed: 20260928
  data_root: ""
