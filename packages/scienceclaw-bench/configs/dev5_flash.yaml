# dev5 with a self-hosted OpenAI-compatible vLLM server on Leonardo (thinking off). Fill `endpoints` with the output of
# scripts/leonardo/tunnel.sh; no gateway credentials are read or sent while endpoints are set.
name: dev5_flash
runs_root: runs
llm:
  endpoints: [http://127.0.0.1:18101/v1]
  policy: {model: sc-flash, max_tokens: 8000, temperature: 0.0, reasoning_effort: null, json_mode: true,
           extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  executor: {model: sc-flash, max_tokens: 2000, temperature: 0.0, reasoning_effort: null, json_mode: false,
             extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  patch: {model: sc-flash, max_tokens: 4000, temperature: 0.0, reasoning_effort: null, json_mode: false,
          extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  concurrency: 24
  timeout_s: 600
  cache_path: cache/llm_cache_local.sqlite
  use_cache: true
solver:
  max_steps: 24
evolution:
  variant: full
  qval: macrosr_then_score
  qval_eps: 0.02
bench:
  disciplines: [FoR31, FoR34, FoR46, FoR35, FoR48]
  items_per_episode: 16
  rounds: 2
  n_val: 2
  n_id: 2
  n_ood: 2
  seed: 20260928
  data_root: ""
