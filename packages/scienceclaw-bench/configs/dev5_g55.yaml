# dev5 with the frozen model lab-gpt-5.5 (reasoning low) for policy, executor and patch roles.
name: dev5_g55
runs_root: runs
llm:
  credentials_file: ~/.config/student-api/client.json
  policy: {model: lab-gpt-5.5, max_tokens: 10000, temperature: 0.0, reasoning_effort: low, json_mode: true}
  executor: {model: lab-gpt-5.5, max_tokens: 2000, temperature: 0.0, reasoning_effort: low, json_mode: false}
  patch: {model: lab-gpt-5.5, max_tokens: 4000, temperature: 0.0, reasoning_effort: low, json_mode: false}
  concurrency: 16
  cache_path: cache/llm_cache_g55.sqlite
  use_cache: true
solver:
  max_steps: 24
evolution:
  variant: full
  qval: macrosr_then_score
  qval_eps: 0.02
bench:
  disciplines: [FoR31, FoR34, FoR46, FoR35, FoR48]   # Life&health, Physical&Earth, Eng&computing, Social, Humanities&law
  items_per_episode: 16
  rounds: 2
  n_val: 2
  n_id: 2
  n_ood: 2
  seed: 20260928
  data_root: ""
