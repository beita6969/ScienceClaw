[project]
name = "scienceclaw"
version = "0.1.0"
description = "Rebuild of ScienceClaw: verifiable program-level self-evolution for AI-for-Science agents"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "pyyaml"]

[project.optional-dependencies]
domain = ["statsmodels", "networkx", "sympy", "joblib", "lightgbm", "xgboost", "rdkit", "nibabel", "jiwer", "sacrebleu", "conllu", "z3-solver"]

[tool.setuptools.packages.find]
include = ["scienceclaw*", "scilib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
