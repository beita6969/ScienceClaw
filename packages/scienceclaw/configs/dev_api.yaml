# Small API development run: 3 disciplines from three families, 2 rounds, one episode per held-out split.
# Unlisted keys take the DESIGN.md defaults (see default.yaml). Nested model roles are given in full because
# a partial role mapping resets the role's other fields to the ModelRole dataclass defaults.
name: dev_api
runs_root: runs
llm:
  credentials_file: ~/.config/scienceclaw/credentials.json
  policy: {model: lab-gpt-5.4-mini, max_tokens: 6000, temperature: 0.0, reasoning_effort: low, json_mode: true}
  executor: {model: lab-gpt-5.4-mini, max_tokens: 2000, temperature: 0.0, reasoning_effort: low, json_mode: false}
  patch: {model: lab-gpt-5.4-mini, max_tokens: 4000, temperature: 0.0, reasoning_effort: low, json_mode: false}
  concurrency: 8
  cache_path: cache/llm_cache.sqlite
  use_cache: true
solver:
  max_steps: 8
evolution:
  variant: full
bench:
  disciplines: [FoR33, FoR34, FoR35]   # Built environment (Eng. & computing), Chemical (Physical & Earth), Tourism (Social)
  items_per_episode: 16
  rounds: 2
  n_val: 1
  n_id: 1
  n_ood: 1
  seed: 20260928
  data_root: ""
