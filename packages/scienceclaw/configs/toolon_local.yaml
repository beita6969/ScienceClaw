# Tool-ON episodes with a self-hosted model (vLLM on a Slurm cluster, thinking off) for policy, executor and patch.
# endpoints = output of scripts/slurm/tunnel.sh (4 single-GPU servers started by scripts/slurm/launch_in_allocation.sh).
# GPU tools (scilib.tsfm / audioenc / textenc ...) need SCIENCECLAW_REMOTE_SPOOL=$PWD/cache/remote_spool and scripts/remote/broker.py running.
name: toolon_local
runs_root: runs
llm:
  endpoints: [http://127.0.0.1:18001/v1, http://127.0.0.1:18002/v1, http://127.0.0.1:18003/v1, http://127.0.0.1:18004/v1]
  policy: {model: sc-llm, max_tokens: 8000, temperature: 0.0, reasoning_effort: null, json_mode: true,
           extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  executor: {model: sc-llm, max_tokens: 2000, temperature: 0.0, reasoning_effort: null, json_mode: false,
             extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  patch: {model: sc-llm, max_tokens: 4000, temperature: 0.0, reasoning_effort: null, json_mode: false,
          extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  concurrency: 32
  timeout_s: 600
  cache_path: cache/llm_cache_local_toolon.sqlite
  use_cache: true
solver:
  max_steps: 24
evolution:
  variant: full
  qval: macrosr_then_score
  qval_eps: 0.02
bench:
  disciplines: []
  items_per_episode: 16
  rounds: 2
  n_val: 2
  n_id: 4
  n_ood: 4
  seed: 20260928
  data_root: ""
